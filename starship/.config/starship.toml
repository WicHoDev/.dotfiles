format = """$hostname$character$directory$git_branch$git_status$line_break$character"""
right_format = """$python $git_commit $cmd_duration"""
add_newline = true

[directory]

[git_branch]
format = """[$symbol$branch(:$remote_branch)]($style)"""

[git_status]
format = '( [\[$all_status$ahead_behind\]]($style) )'

[python]
style = "yellow bold"
format = '[($virtualenv)]($style)'

[hostname]
ssh_only = false
style = "bold green"
format = "[$hostname]($style)"
